name: Publish to Hex.pm

on:
  push:
    tags:
      - "v*"

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "28.5.0.7"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - name: Verify release tag matches package version
        run: >-
          mix run --no-start -e
          'expected = "v" <> Mix.Project.config()[:version];
          unless System.fetch_env!("GITHUB_REF_NAME") == expected,
          do: raise("Release tag must match package version: #{expected}")'
      - run: mix ci
      - run: MIX_ENV=dev mix docs --warnings-as-errors

  publish:
    name: Publish to Hex.pm
    needs: test
    runs-on: ubuntu-latest
    env:
      ALLOY_WEBSITE_SYNC_TOKEN: ${{ secrets.ALLOY_WEBSITE_SYNC_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix compile

      - name: Publish to Hex.pm
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      - name: Trigger landing-site version sync
        if: ${{ env.ALLOY_WEBSITE_SYNC_TOKEN != '' }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${ALLOY_WEBSITE_SYNC_TOKEN}" \
            https://api.github.com/repos/alloy-ex/alloy-ex.github.io/dispatches \
            -d "{\"event_type\":\"hex_release_published\",\"client_payload\":{\"tag\":\"${GITHUB_REF_NAME}\"}}"

      - name: Skip landing-site sync dispatch (missing token)
        if: ${{ env.ALLOY_WEBSITE_SYNC_TOKEN == '' }}
        run: |
          echo "::warning::ALLOY_WEBSITE_SYNC_TOKEN is not configured; landing-site sync was not triggered."
